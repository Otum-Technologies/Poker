name: CI


on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: install dependencies
        run: uv sync --locked

      - name: run checks
        run: uv run just check